version: "3.9"

services:
  server:
    build: ./crypto-flex-server
    ports:
      - "3000:3000"
    env_file:
      - ./crypto-flex-server/.env
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  client:
    build: ./crypto-flex
    ports:
      - "5173:80"
    depends_on:
      - server
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crypto_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
